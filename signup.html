<!DOCTYPE html>
<html lang="en">
<head>

  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-P4D8GL6D');</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Indexly</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P4D8GL6D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

<nav class="navbar">
  <div class="nav-container">
    <div class="logo">🏥 Indexly</div>
    <div class="menu-icon" id="menuIcon">☰</div>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="doctors.html">Doctors</a>
      <a href="login.html">Login</a>
      <button id="darkModeToggle" class="btn-outline">🌙</button>
    </div>
  </div>
</nav>

<div class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="glass-card" style="max-width: 450px; width: 90%; padding: 2.5rem;">
    <h2 style="text-align: center;">Create Account</h2>
    <form id="signupForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="fullname" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
      <div class="form-group"><label>Password (min 6)</label><input type="password" id="password" required minlength="6"></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" required></div>
      <button type="submit" class="btn-primary" style="width:100%;">Sign Up →</button>
    </form>
    <p style="text-align:center; margin-top:1rem;">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script>
  document.getElementById('signupForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullname = document.getElementById('fullname').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    if(password !== confirm) { alert('Passwords do not match'); return; }
    const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: fullname } } });
    if(error) alert('Signup failed: ' + error.message);
    else { alert('Account created! Please login.'); window.location.href = 'login.html'; }
  });
  
  document.getElementById('menuIcon')?.addEventListener('click', () => document.getElementById('navLinks').classList.toggle('active'));
  document.getElementById('darkModeToggle')?.addEventListener('click', () => document.body.classList.toggle('dark'));
</script>
</body>
</html>
